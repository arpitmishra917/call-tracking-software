name: CallFlow CI Pipeline

on:
  push:
    branches: [main, master, develop, "agent/*"]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-build:
    name: Build & Test Applications
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/calltracking_ci?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/calltracking_ci?schema=public"
        run: npx prisma generate

      - name: Build Backend API (apps/api)
        working-directory: apps/api
        run: npm run build

      - name: Build Frontend Web (apps/web)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
          NEXT_PUBLIC_API_URL: "http://localhost:3000"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3001"
        run: npm run build
