[general]
static=yes
writeprotect=no
clearglobalvars=no

[from-telnyx-buyer]
; Inbound buyer endpoint for QA testing
; Triggered when CallFlow bridges the call to sip:arpitmishra9178@sip.telnyx.com
exten => _.,1,NoOp(--- [QA-BUYER] Incoming call from ${CALLERID(all)} to ${EXTEN} (RunID: ${PJSIP_HEADER(read,X-QA-Run-Id)}) ---)
 same => n,Answer()
 same => n,Stasis(callflow-qa,buyer,${PJSIP_HEADER(read,X-QA-Run-Id)})
 same => n,Hangup()

exten => h,1,NoOp(--- [QA-BUYER] Call hangup with cause: ${HANGUPCAUSE} ---)

[from-telnyx-buyer-b]
; Inbound buyer B endpoint for QA testing
; Triggered when CallFlow bridges the call to sip:arpitmishra9178b@sip.telnyx.com
exten => _.,1,NoOp(--- [QA-BUYER-B] Incoming call from ${CALLERID(all)} to ${EXTEN} (RunID: ${PJSIP_HEADER(read,X-QA-Run-Id)}) ---)
 same => n,Answer()
 same => n,Stasis(callflow-qa,buyer-b,${PJSIP_HEADER(read,X-QA-Run-Id)})
 same => n,Hangup()

exten => h,1,NoOp(--- [QA-BUYER-B] Call hangup with cause: ${HANGUPCAUSE} ---)

[from-telnyx-caller]
; Inbound / internal caller leg dialplan (used when originating from Asterisk)
exten => _.,1,NoOp(--- [QA-CALLER] Caller leg active for ${EXTEN} ---)
 same => n,Answer()
 same => n,Wait(1)
 ; Play deterministic 1000 Hz caller audio marker (2 seconds)
 same => n,Playback(/var/lib/asterisk/sounds/qa/qa-caller-marker)
 ; Record returned buyer audio to persistent volume
 same => n,Record(/var/spool/asterisk/recording/caller-received-%d:wav,2,10)
 same => n,Wait(1)
 same => n,Hangup()

exten => h,1,NoOp(--- [QA-CALLER] Call hangup with cause: ${HANGUPCAUSE} ---)

[local-audio-test]
; Dedicated local audio loopback test extensions for QA diagnostic validation (zero carrier egress)
exten => 1000,1,NoOp(--- [LOCAL-TEST] Playing 1000 Hz caller marker ---)
 same => n,Answer()
 same => n,Playback(/var/lib/asterisk/sounds/qa/qa-caller-marker)
 same => n,Wait(1)
 same => n,Hangup()

exten => 1500,1,NoOp(--- [LOCAL-TEST] Playing 1500 Hz buyer marker ---)
 same => n,Answer()
 same => n,Playback(/var/lib/asterisk/sounds/qa/qa-buyer-marker)
 same => n,Wait(1)
 same => n,Hangup()

